<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Agri AI - Cost Estimator</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="header">
    <h1>Smart Agri AI</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/predict">Predict</a>
      <a href="/cost-estimator">Cost Estimator</a>
      <a href="/about">About</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>

  <main class="container">
    <section class="card hero">
      <h2>Crop Cost + Production Economics</h2>
      <form id="costForm" class="grid">
        <input name="crop_name" placeholder="crop name (tomato)" value="tomato" />
        <input name="land_area_acre" type="number" step="0.1" value="1.0" placeholder="land area acre" />
        <select name="is_land_rented"><option value="true">rented</option><option value="false">owned</option></select>
        <input name="land_rent_inr" type="number" value="30000" placeholder="land rent" />
        <input name="duration_months" type="number" value="6" placeholder="duration months" />
        <input name="labor_count" type="number" value="4" placeholder="labor count" />
        <input name="labor_daily_wage_inr" type="number" value="700" placeholder="daily wage" />
        <input name="self_work_hours_per_day" type="number" step="0.5" value="2" placeholder="self work hours/day" />
        <input name="water_cycles" type="number" value="6" placeholder="water cycles" />
        <input name="water_cost_per_cycle_inr" type="number" value="2500" placeholder="water per cycle" />
        <input name="seed_cost_inr" type="number" value="7000" placeholder="seed" />
        <input name="fertilizer_cost_inr" type="number" value="12000" placeholder="fertilizer" />
        <input name="pesticide_cost_inr" type="number" value="9000" placeholder="pesticide" />
        <input name="insecticide_cost_inr" type="number" value="6000" placeholder="insecticide" />
        <input name="spray_cost_inr" type="number" value="5000" placeholder="spray cost" />
        <input name="tractor_cost_inr" type="number" value="8000" placeholder="tractor" />
        <input name="transport_to_market_inr" type="number" value="5500" placeholder="transport" />
        <input name="misc_cost_inr" type="number" value="5000" placeholder="misc" />
        <input name="soil_quality_index" type="number" step="0.1" value="6.0" placeholder="soil quality (0-10)" />
        <input name="irrigation_quality_index" type="number" step="0.1" value="6.0" placeholder="irrigation quality (0-10)" />
        <input name="expected_rainfall_mm" type="number" step="1" value="700" placeholder="expected rainfall (mm)" />
        <input name="pest_pressure_index" type="number" step="0.1" value="4.0" placeholder="pest pressure (0-10)" />
        <input name="expected_yield_quintal" type="number" step="0.1" value="120" placeholder="expected yield (quintal)" />
        <input name="expected_market_price_inr_per_quintal" type="number" step="1" value="1800" placeholder="market price per quintal" />
        <button type="submit">Estimate Total Cost</button>
      </form>
    </section>

    <section id="costResult" class="card hidden">
      <h3>Estimated Budget</h3>
      <p><strong>Predicted Total:</strong> INR <span id="predCost"></span></p>
      <p><strong>Expected Range:</strong> INR <span id="minCost"></span> - INR <span id="maxCost"></span></p>
      <p><strong>Projected Revenue:</strong> INR <span id="revCost"></span></p>
      <p><strong>Projected Profit:</strong> INR <span id="profitCost"></span></p>
      <pre id="breakdown"></pre>
    </section>
  </main>

  <script src="/static/cost.js"></script>
</body>
</html>
