services:
  - type: web
    name: agri-smart
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        value: change-me
      - key: CONFIDENCE_TEMPERATURE
        value: "1.3"
